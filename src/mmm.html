<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Shop</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            width: 100%;
            min-height: 100vh;
            background-color: #f0d0bd;
        }

        .hero {
            background:
                linear-gradient(90deg, rgba(0,0,0,.65), rgba(0,0,0,.05)),
                url('https://images.unsplash.com/photo-1447933601403-0c6688de566e?w=1800');

            background-size: cover;
            background-position: center;
            height: 480px;
            border-radius: 0 0 48% 12% / 0 0 18% 12%;
        }

        .coffee-card img {
            transition: transform .4s ease;
        }

        .coffee-card:hover img {
            transform: scale(1.08);
        }

        .coffee-card {
            transition: box-shadow .3s ease;
        }

        .coffee-card:hover {
            box-shadow: 0 15px 30px rgba(0,0,0,.2);
        }

        @media (max-width: 768px) {
            .hero {
                height: 380px;
            }
        }
    </style>
</head>

<body>

    <!-- Main Website -->
    <main class="w-full min-h-screen bg-[#f0d0bd] overflow-hidden">

        <!-- Navbar -->
        <header class="w-full px-6 md:px-12 py-6">

            <nav class="flex items-center justify-between">

                <!-- Logo -->
                <a href="#" class="flex items-center gap-2 text-[#49332d]">

                    <span class="text-3xl">☕</span>

                    <span class="font-bold text-lg">
                        Cozy Solutions
                    </span>

                </a>

                <!-- Navigation -->
                <ul class="hidden md:flex items-center gap-10 text-[#49332d] font-semibold text-sm">

                    <li>
                        <a href="#" class="hover:text-[#a66b4c] transition">Home</a>
                    </li>

                    <li>
                        <a href="#menu" class="hover:text-[#a66b4c] transition">Menu</a>
                    </li>

                    <li>
                        <a href="#" class="hover:text-[#a66b4c] transition">Blog</a>
                    </li>

                    <li>
                        <a href="#" class="hover:text-[#a66b4c] transition">Media</a>
                    </li>

                    <li>
                        <a href="#" class="hover:text-[#a66b4c] transition">Contact</a>
                    </li>

                </ul>

                <!-- Search -->
                <span class="text-3xl text-[#49332d] cursor-pointer">
                    ⌕
                </span>

            </nav>

        </header>


        <!-- Hero Section -->
        <section class="hero w-full flex items-center px-8 md:px-16">

            <div class="text-white">

                <p class="text-2xl md:text-4xl font-light text-gray-300 tracking-wide">
                    FRESHLY ROASTED
                </p>

                <h1 class="text-6xl md:text-8xl font-extrabold text-[#f3b99c] mt-2">
                    COFFEE
                </h1>

                <button class="bg-white text-[#49332d] rounded-full px-8 py-3 mt-8 text-sm font-semibold hover:bg-[#f3b99c] transition">
                    Shop now
                </button>

            </div>

        </section>


        <!-- Categories Section -->
        <section id="menu" class="w-full px-6 md:px-16 py-20 text-center"><h2 class="text-3xl md:text-4xl font-bold text-[#352622]">
                TOP CATEGORIES
            </h2>

            <p class="text-[#75594e] font-semibold mt-4 text-sm md:text-lg">
                Explore The Recent Most Bought Drinks This Week
            </p>


            <!-- Coffee Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-12">


                <!-- Card 1 -->
                <div class="coffee-card relative h-[270px] rounded-[35px] overflow-hidden group">

                    <img
                        src="https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=800"
                        alt="Coffee Mocha"
                        class="w-full h-full object-cover"
                    >

                    <div class="absolute inset-0 bg-black/40 group-hover:bg-black/55 transition"></div>

                    <div class="absolute inset-0 flex flex-col justify-center items-center text-white">

                        <h3 class="text-xl md:text-2xl font-bold">
                            Coffee Mocha
                        </h3>

                        <a href="#" class="mt-6 text-sm font-semibold hover:text-[#f3b99c]">
                            View More
                        </a>

                    </div>

                </div>


                <!-- Card 2 -->
                <div class="coffee-card relative h-[270px] rounded-[35px] overflow-hidden group">

                    <img
                        src="https://images.unsplash.com/photo-1510707577719-ae7c14805e3a?w=800"
                        alt="Espresso Americano"
                        class="w-full h-full object-cover"
                    >

                    <div class="absolute inset-0 bg-black/40 group-hover:bg-black/55 transition"></div>

                    <div class="absolute inset-0 flex flex-col justify-center items-center text-white">

                        <h3 class="text-xl md:text-2xl font-bold">
                            Espresso Americano
                        </h3>

                        <a href="#" class="mt-6 text-sm font-semibold hover:text-[#f3b99c]">
                            View More
                        </a>

                    </div>

                </div>


                <!-- Card 3 -->
                <div class="coffee-card relative h-[270px] rounded-[35px] overflow-hidden group">

                    <img
                        src="https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=800"
                        alt="Cappuccino"
                        class="w-full h-full object-cover"
                    >

                    <div class="absolute inset-0 bg-black/40 group-hover:bg-black/55 transition"></div>

                    <div class="absolute inset-0 flex flex-col justify-center items-center text-white">

                        <h3 class="text-xl md:text-2xl font-bold">
                            Cappuccino
                        </h3>

                        <a href="#" class="mt-6 text-sm font-semibold hover:text-[#f3b99c]">
                            View More
                        </a>

                    </div>

                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer class="w-full bg-[#382a27] text-white text-center py-6">

            <p class="text-sm">
                © 2026 Cozy Solutions. All Rights Reserved.
            </p>

        </footer>

    </main>

</body>
</html>
